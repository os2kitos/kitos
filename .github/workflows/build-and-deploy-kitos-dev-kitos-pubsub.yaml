name: Build and deploy kitos-pubsub

on:
  pull_request:
    types:
      - closed
    branches:
      - "master"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "strongminds/kitos-kitos-pubsub"
  DEPLOYMENT_MANIFEST: "infrastructure/kitos-dev/kitos/services/kitos-pubsub/deployment.yaml"

jobs:
  wait_for_earlier_runs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Wait for earlier deploys
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for earlier deploys
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const pollIntervalMs = 30000;
            const maxWaitMs = 45 * 60 * 1000;
            const deadline = Date.now() + maxWaitMs;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const listActiveRuns = status => github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status,
              per_page: 100
            });

            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: currentRunId
            });

            const currentCreatedAt = new Date(currentRun.created_at).getTime();
            const isEarlierRun = run => {
              const runCreatedAt = new Date(run.created_at).getTime();
              return runCreatedAt < currentCreatedAt ||
                (runCreatedAt === currentCreatedAt && run.id < currentRunId);
            };

            while (Date.now() < deadline) {
              const [queuedRuns, inProgressRuns] = await Promise.all([
                listActiveRuns("queued"),
                listActiveRuns("in_progress")
              ]);

              const blockingRuns = [...queuedRuns, ...inProgressRuns]
                .filter(run =>
                  run.id !== currentRunId &&
                  run.path?.startsWith(".github/workflows/build-and-deploy-") &&
                  isEarlierRun(run))
                .sort((left, right) => {
                  const createdAtDiff = new Date(left.created_at) - new Date(right.created_at);
                  return createdAtDiff !== 0 ? createdAtDiff : left.id - right.id;
                });

              if (blockingRuns.length === 0) {
                core.info("No earlier build-and-deploy runs are pending. Continuing.");
                return;
              }

              core.info(`Waiting for ${blockingRuns.length} earlier build-and-deploy run(s): ${blockingRuns.map(run => `${run.name}#${run.run_number} (${run.status})`).join(", ")}`);
              await sleep(pollIntervalMs);
            }

            throw new Error(`Timed out waiting for earlier build-and-deploy runs after ${maxWaitMs / 60000} minutes.`);

  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Build
    runs-on: ubuntu-latest
    needs: wait_for_earlier_runs
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr,enable=${{ github.ref != 'refs/heads/master' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          context: "./"
          file: "PubSub.Application.Api/Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Update tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: "master"
          # https://github.com/orgs/community/discussions/25305#discussioncomment-10728028
          ssh-key: ${{ secrets.WRITE_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Get version
        id: version
        run: |
          echo "old=$(grep "image:" '${{ env.DEPLOYMENT_MANIFEST }}' | sed -r -e 's/.+\:(.*)/\1/g')" >> $GITHUB_OUTPUT
          echo "new=$(echo '${{ needs.build.outputs.tags }}' | grep -v latest | sed -r -e 's/.+\:(.*)/\1/g')" >> $GITHUB_OUTPUT

      - name: Get new image
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new }}" >> $GITHUB_OUTPUT

      - name: Replace image
        run: |
          sed -r 's|(image:\s*).+|\1${{ steps.image.outputs.image }}|' -i "${{ env.DEPLOYMENT_MANIFEST }}"

      - name: Commit changes
        run: |
          git add "${{ env.DEPLOYMENT_MANIFEST }}"

      - uses: qoomon/actions--create-commit@v1
        id: commit
        with:
          message: "Promoted kitos-pubsub to version ${{ steps.version.outputs.new }}"
          skip-empty: true

      - name: Git Push
        run: |
          max_attempts=5
          timeout_seconds=3
          git config pull.ff only
          for i in $(seq 1 $max_attempts); do
            echo "Pull and push attempt $i"

            if git pull origin master; then
              if git push origin master; then
                echo "Push succeeded on attempt $i"
                break
              else
                echo "Push failed on attempt $i"
              fi
            else
              echo "Pull failed on attempt $i"
              echo "Git status:"
              git status
            fi

            if [ "$i" -lt $max_attempts ]; then
              echo "Waiting before retry..."
              sleep $timeout_seconds
            else
              echo "All $max_attempts attempts failed. Giving up."
              exit 1
            fi
          done
