name: Build and deploy strongminds/os2kitos-development/kitos-dev/ktios-api

on:
  pull_request:
    types:
      - closed
    branches:
      - "master"
  workflow_dispatch:


concurrency:
  group: easyhosting-master-git-write
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "strongminds/kitos-ktios-api"
  DEPLOYMENT_MANIFEST: "infrastructure/os2kitos-development/kitos-dev/services/ktios-api/deployment.yaml"
  RELEASE_DIRECTORY: ".easyhosting/releases/kitos-ci/kitos-api"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      digest: ${{ steps.push.outputs.digest }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'master' }}"

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=long,enable=true

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          context: "./"
          file: "Presentation.Web/Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Update tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: "master"
          # https://github.com/orgs/community/discussions/25305#discussioncomment-10728028
          ssh-key: ${{ secrets.WRITE_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Get version
        id: version
        run: |
          echo "old=$(grep 'image:' \"${{ env.DEPLOYMENT_MANIFEST }}\" | sed -r -e 's/^\s*image:\s*//')" >> "$GITHUB_OUTPUT"
          echo "new=${{ needs.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Get new image
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.version.outputs.new }}" >> $GITHUB_OUTPUT

      - name: Replace image
        run: |
          sed -r 's|(image:\s*).+|\1${{ steps.image.outputs.image }}|' -i "${{ env.DEPLOYMENT_MANIFEST }}"

      - name: Commit changes
        run: |
          mkdir -p "${{ env.RELEASE_DIRECTORY }}"
          release_file="${{ env.RELEASE_DIRECTORY }}/${{ needs.build.outputs.source-sha }}-${{ github.run_id }}.json"
          jq -n \
            --arg releaseId "${{ needs.build.outputs.digest }}" \
            --arg applicationId "kitos-dev" \
            --arg serviceName "ktios-api" \
            --arg repositoryUrl "${{ github.server_url }}/${{ github.repository }}" \
            --arg releaseStream "kitos-ci/kitos-api" \
            --arg requestedRevisionKind "DefaultBranch" \
            --arg requestedRevisionValue "" \
            --arg resolvedCommitSha "${{ needs.build.outputs.source-sha }}" \
            --arg imageRepository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --arg imageDigest "${{ needs.build.outputs.digest }}" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg buildRunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{schemaVersion: 1, releaseId: $releaseId, applicationId: $applicationId, serviceName: $serviceName, repositoryUrl: $repositoryUrl, releaseStream: $releaseStream, sourceRevision: {requestedKind: $requestedRevisionKind, requestedValue: $requestedRevisionValue, resolvedCommitSha: $resolvedCommitSha}, image: {repository: $imageRepository, digest: $imageDigest}, build: {createdAt: $createdAt, runUrl: $buildRunUrl}}' > "$release_file"
          git add "${{ env.DEPLOYMENT_MANIFEST }}"
          git add -f "$release_file"

      - uses: qoomon/actions--create-commit@v1
        id: commit
        with:
          message: "Promoted ktios-api to version ${{ steps.version.outputs.new }}"
          skip-empty: true

      - name: Git Push
        run: |
          git push origin master
