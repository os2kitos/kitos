apiVersion: batch/v1
kind: Job
metadata:
  name: provision-database-fc5c4ec1884d472ab2fb353fa5bcd13f
  namespace: kitos-staging
  labels:
    app.kubernetes.io/managed-by: easyhosting
    easyhosting.io/resource-kind: database-provisioning
    easyhosting.io/resource-id: "fc5c4ec1884d472ab2fb353fa5bcd13f"
    easyhosting.io/database-server-id: "fba2bf1dcc0c4ba5a01cd13f9e0abd6b"
    easyhosting.io/application-id: "kitos-staging"
  annotations:
    easyhosting.io/display-name: "hangfiredb"
    easyhosting.io/manifest-path: "infrastructure/ezh-772-mrj5/kitos-staging/database-servers/staging-db-server/databases/hangfiredb/provisioning-job.yaml"
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: easyhosting
        easyhosting.io/resource-kind: database-provisioning
        easyhosting.io/resource-id: "fc5c4ec1884d472ab2fb353fa5bcd13f"
    spec:
      restartPolicy: Never
      containers:
        - name: provision-database
          image: ghcr.io/cloudnative-pg/postgresql:17
          env:
            - name: PGHOST
              value: "staging-db-server-rw"
            - name: PGDATABASE
              value: "postgres"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-role-secret-hangfireuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-role-secret-hangfireuser
                  key: password
            - name: TARGET_DATABASE
              value: "hangfiredb"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              attempt=0
              until psql --set=ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 150 ]; then
                  echo "Timed out waiting for the PostgreSQL cluster and application role" >&2
                  exit 1
                fi
                sleep 2
              done

              psql --set=ON_ERROR_STOP=1 \
                --set=target_database="$TARGET_DATABASE" \
                --set=target_owner="$PGUSER" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'target_database', :'target_owner')
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = :'target_database'
              )
              \gexec
              SQL