apiVersion: batch/v1
kind: Job
metadata:
  name: provision-database-aa012993c51345918a7826dfb7405256
  namespace: dev
  labels:
    app.kubernetes.io/managed-by: easyhosting
    easyhosting.io/resource-kind: database-provisioning
    easyhosting.io/resource-id: "aa012993c51345918a7826dfb7405256"
    easyhosting.io/database-server-id: "3f509e14d61440c18bbe958a139f9009"
    easyhosting.io/application-id: "dev"
  annotations:
    easyhosting.io/display-name: "pubsub"
    easyhosting.io/manifest-path: "infrastructure/ezh-772-mrj5/dev/database-servers/kitos-db-server-restore/databases/pubsub/provisioning-job.yaml"
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: easyhosting
        easyhosting.io/resource-kind: database-provisioning
        easyhosting.io/resource-id: "aa012993c51345918a7826dfb7405256"
    spec:
      restartPolicy: Never
      containers:
        - name: provision-database
          image: ghcr.io/cloudnative-pg/postgresql:17
          env:
            - name: PGHOST
              value: "kitos-db-server-restore-rw"
            - name: PGDATABASE
              value: "postgres"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-role-secret-user-pubsub-6661ec476650
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-role-secret-user-pubsub-6661ec476650
                  key: password
            - name: TARGET_DATABASE
              value: "pubsub"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              attempt=0
              until psql --set=ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 150 ]; then
                  echo "Timed out waiting for the PostgreSQL cluster and application role" >&2
                  exit 1
                fi
                sleep 2
              done

              psql --set=ON_ERROR_STOP=1 \
                --set=target_database="$TARGET_DATABASE" \
                --set=target_owner="$PGUSER" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'target_database', :'target_owner')
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = :'target_database'
              )
              \gexec
              SQL