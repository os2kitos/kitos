apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: PubSub.Broker/Dockerfile
    easyhosting.io/service-unique-id: bcb917c6-a054-43e6-955f-540735aa4dc5
    easyhosting.io/easy-hosting-domain-name: bcb917c6-a054-43e6-955f-540735aa4dc5.ezh-772-mrj5.strongminds.easyhosting.strongminds.dev
  labels:
    app: kitos-broker
  name: kitos-broker
  namespace: dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-broker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: monitoring/sidecar-otel-collector
        easyhosting.io/otlp-logs: "true"
      labels:
        app: kitos-broker
        app.kubernetes.io/name: kitos-broker
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: RabbitMqUsername
              name: user-secret
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: RabbitMqPassword
              name: user-secret
        image: '{will be replaced by build pipeline}'
        name: kitos-broker
        ports:
        - containerPort: 15672
          name: http
          protocol: TCP
        - containerPort: 5672
          name: amqp
          protocol: TCP
        resources:
          limits:
            memory: 2Gi
            cpu: 2
          requests:
            memory: 1Gi
            cpu: 1
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: kitos-broker
          readOnly: false
      imagePullSecrets:
      - name: b9abd9f7-4fbb-4871-a9d7-6aef45cb79bd
      volumes:
      - name: kitos-broker
        persistentVolumeClaim:
          claimName: kitos-broker
          readOnly: false