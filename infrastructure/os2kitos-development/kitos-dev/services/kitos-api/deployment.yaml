apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Presentation.Web/Dockerfile
    easyhosting.io/service-unique-id: b4868377-efca-4369-bea1-844f64181b9b
    easyhosting.io/easy-hosting-domain-name: b4868377-efca-4369-bea1-844f64181b9b.os2kitos-development.strongminds.easyhosting.strongminds.dev
  labels:
    app: kitos-api
  name: kitos-api
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: monitoring/sidecar-otel-collector
        easyhosting.io/otlp-logs: "true"
      labels:
        app: kitos-api
        app.kubernetes.io/name: kitos-api
    spec:
      containers:
      - env:
        - name: AppSettings__LogFilePath
          valueFrom:
            configMapKeyRef:
              key: LogFilePath
              name: user-variables
        - name: Smtp__PickupDirectoryLocation
          valueFrom:
            configMapKeyRef:
              key: PickupDirectoryLocation
              name: user-variables
        - name: Smtp__DeliveryMethod
          value: SpecifiedPickupDirectory
        - name: ASPNETCORE_ENVIRONMENT
          value: Dev
        - name: Database__Provider
          value: PostgreSql
        - name: Hangfire__Provider
          value: PostgreSql
        - name: ConnectionStrings__KitosContext
          valueFrom:
            secretKeyRef:
              key: KitosDbConnectionString
              name: user-secret
        - name: ConnectionStrings__kitos_HangfireDB
          valueFrom:
            secretKeyRef:
              key: HangfireDbConnectionString
              name: user-secret
        - name: AppSettings__BaseUrl
          value: https://kitos-dev.strongminds.tech/
        - name: AppSettings__PubSubBaseUrl
          valueFrom:
            configMapKeyRef:
              key: PubSubBaseUrl
              name: user-variables
        - name: AppSettings__SecurityKeyString
          valueFrom:
            secretKeyRef:
              key: SecurityKeyString
              name: user-secret
        - name: Smtp__Host
          valueFrom:
            configMapKeyRef:
              key: AwsSmtpNetworkHost
              name: user-variables
        - name: Smtp__Port
          valueFrom:
            configMapKeyRef:
              key: AwsSmtpNetworkPort
              name: user-variables
        - name: Smtp__Password
          valueFrom:
            secretKeyRef:
              key: AwsSmtpPassword
              name: user-secret
        - name: Smtp__UserName
          valueFrom:
            secretKeyRef:
              key: AwsSmtpUsername
              name: user-secret
        - name: Smtp__EnableSsl
          value: "true"
        - name: Smtp__From
          valueFrom:
            configMapKeyRef:
              key: AwsSmtpFromEmail
              name: user-variables
        image: ghcr.io/strongminds/kitos-kitos-api@sha256:1f37f2dcb170810986d9b54f38b50978194e9763e0311b0b836e3b9ded87e1e1
        name: kitos-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 6Gi
            cpu: 2
          requests:
            memory: 768Mi
            cpu: 1
        volumeMounts:
        - mountPath: /temp
          name: kitos-api-volume
          readOnly: false
      imagePullSecrets:
      - name: ac6379be-068d-4385-a6c6-6a13c7f5f2e6
      volumes:
      - name: kitos-api-volume
        persistentVolumeClaim:
          claimName: kitos-api-volume
          readOnly: false