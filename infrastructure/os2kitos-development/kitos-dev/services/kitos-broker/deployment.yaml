apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: PubSub.Broker/Dockerfile
    easyhosting.io/service-unique-id: 9b13e5d3-84ff-4402-9b42-5808339ccff3
    easyhosting.io/easy-hosting-domain-name: 9b13e5d3-84ff-4402-9b42-5808339ccff3.os2kitos-development.strongminds.easyhosting.strongminds.dev
  labels:
    app: kitos-broker
  name: kitos-broker
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-broker
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: monitoring/sidecar-otel-collector
        easyhosting.io/otlp-logs: "true"
      labels:
        app: kitos-broker
        app.kubernetes.io/name: kitos-broker
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: RabbitMqUsername
              name: user-secret
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: RabbitMqPassword
              name: user-secret
        image: ghcr.io/strongminds/kitos-kitos-broker@sha256:4a00f43046c82489a5de54248c49537380f46fb48236ea7a7602db0b7333e866
        name: kitos-broker
        ports: []
        resources:
          limits:
            memory: 2Gi
            cpu: 2
          requests:
            memory: 1Gi
            cpu: 1
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: kitos-broker-volume
          readOnly: false
      imagePullSecrets:
      - name: ac6379be-068d-4385-a6c6-6a13c7f5f2e6
      volumes:
      - name: kitos-broker-volume
        persistentVolumeClaim:
          claimName: kitos-broker-volume
          readOnly: false