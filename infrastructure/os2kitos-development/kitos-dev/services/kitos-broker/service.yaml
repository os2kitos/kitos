apiVersion: v1
kind: Service
metadata:
  name: kitos-broker
  namespace: kitos-dev
spec:
  ports:
  - appProtocol: http
    name: ampq
    port: 5672
    protocol: TCP
    targetPort: 5672
  - appProtocol: http
    name: http
    port: 15672
    protocol: TCP
    targetPort: 15672
  selector:
    app: kitos-broker
  type: ClusterIP
