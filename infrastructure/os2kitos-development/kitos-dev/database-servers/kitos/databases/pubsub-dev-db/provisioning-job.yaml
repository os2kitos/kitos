apiVersion: batch/v1
kind: Job
metadata:
  name: provision-database-c7ca8ff2211349efa43a619a8ed02034
  namespace: kitos-dev
  labels:
    app.kubernetes.io/managed-by: easyhosting
    easyhosting.io/resource-kind: database-provisioning
    easyhosting.io/resource-id: "c7ca8ff2211349efa43a619a8ed02034"
    easyhosting.io/database-server-id: "edef42cfc8144b8fa70bb186e406dbf5"
    easyhosting.io/application-id: "kitos-dev"
  annotations:
    easyhosting.io/display-name: "pubsub-dev-db"
    easyhosting.io/manifest-path: "infrastructure/os2kitos-development/kitos-dev/database-servers/kitos/databases/pubsub-dev-db/provisioning-job.yaml"
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: easyhosting
        easyhosting.io/resource-kind: database-provisioning
        easyhosting.io/resource-id: "c7ca8ff2211349efa43a619a8ed02034"
    spec:
      restartPolicy: Never
      containers:
        - name: provision-database
          image: ghcr.io/cloudnative-pg/postgresql:17
          env:
            - name: PGHOST
              value: "kitos-rw"
            - name: PGDATABASE
              value: "postgres"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-role-secret-pubsub
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-role-secret-pubsub
                  key: password
            - name: TARGET_DATABASE
              value: "pubsub-dev-db"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              attempt=0
              until psql --set=ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 150 ]; then
                  echo "Timed out waiting for the PostgreSQL cluster and application role" >&2
                  exit 1
                fi
                sleep 2
              done

              psql --set=ON_ERROR_STOP=1 \
                --set=target_database="$TARGET_DATABASE" \
                --set=target_owner="$PGUSER" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'target_database', :'target_owner')
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = :'target_database'
              )
              \gexec
              SQL